name: Release

# Two ways to start a release:
#   1. Actions > Release > Run workflow (enter the version; tick "dry run" to only build and test)
#   2. push a tag such as v0.2.0
# The scheduled workflow (release-schedule.yml) uses way 1 every second month.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without "v" (for example 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: build and test only, do not tag, publish or create a release'
        type: boolean
        default: true
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional: add required reviewers to the "release" environment (Settings > Environments)
    # to make every release, including scheduled ones, wait for a human approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out version and mode
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            version="${REF_NAME#v}"
            dry=false
            prerelease=false
          else
            version="$INPUT_VERSION"
            dry="$INPUT_DRY_RUN"
            prerelease="$INPUT_PRERELEASE"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a valid version (expected like 0.1.0 or 0.2.0-rc1)"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          tag="v$version"
          if [ "$EVENT" != push ] && [ "$dry" != true ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Real releases must be started from the main branch (got $REF)"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag $tag already exists"
              exit 1
            fi
          fi
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "dry=$dry"
            echo "prerelease=$prerelease"
            echo "prev=$prev"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (dry run: $dry, pre-release: $prerelease, previous tag: ${prev:-none})"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set the release version in the poms (this workspace only, nothing is committed)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: mvn -B -ntp -q versions:set -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Smoke test and check the version stamp
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          jar=ratchet-cli/target/ratchet.jar
          actual="$(java -jar "$jar" --version)"
          echo "jar says: $actual"
          [ "$actual" = "ratchet4j $VERSION" ] || { echo "::error::version stamp mismatch (expected 'ratchet4j $VERSION')"; exit 1; }
          bash .github/scripts/smoke-test.sh "$jar"

      - name: Prepare release files
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PREV: ${{ steps.meta.outputs.prev }}
        run: |
          set -euo pipefail
          mkdir dist
          cp ratchet-cli/target/ratchet.jar "dist/ratchet-$VERSION.jar"
          (cd dist && sha256sum "ratchet-$VERSION.jar" > "ratchet-$VERSION.jar.sha256")
          bash .github/scripts/release-notes.sh "$VERSION" "$PREV" > notes.md
          {
            echo "### Release files"
            echo '```'
            cat "dist/ratchet-$VERSION.jar.sha256"
            echo '```'
            echo
            echo "### Release notes"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the files as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/
            notes.md

      - name: Publish to Maven Central
        if: steps.meta.outputs.dry != 'true' && vars.PUBLISH_TO_CENTRAL == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          AUTO_PUBLISH: ${{ vars.CENTRAL_AUTO_PUBLISH == 'true' }}
        run: mvn -B -ntp -Prelease -DskipTests -Dcentral.autoPublish="$AUTO_PUBLISH" deploy

      - name: Create the GitHub release
        if: steps.meta.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            "dist/ratchet-$VERSION.jar" "dist/ratchet-$VERSION.jar.sha256" \
            --target "$GITHUB_SHA" \
            --title "ratchet4j $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
